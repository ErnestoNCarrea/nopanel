;########################################################################
; noPanel OPcache performance tuning (https://docs.nopanel.cc)           #
; DO NOT MODIFY THIS FILE! YOUR CHANGES WILL BE LOST!                   #
;########################################################################
; Loaded after the opcache extension's default ini (zz- > 10-); last value wins.

; Serve file_exists()/is_file()/filetype() from the cache (avoids stat syscalls).
opcache.enable_file_override = 1

; News/WP sites have many files; 10000 (default) fills up and causes evictions.
opcache.max_accelerated_files = 40000

; 128M can evict under many pools; 256M is cheap on modern hosts.
opcache.memory_consumption = 256
